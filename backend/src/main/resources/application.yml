spring:
  application:
    name: career-ai-backend

  # ─── DATABASE ────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerai}?currentSchema=public
    username: ${DB_USER:careerai}
    password: ${DB_PASSWORD:careeraiSecret123!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ─── FLYWAY ───────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── REDIS ────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redisSecret123!}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # ─── CACHE ────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  # ─── RABBITMQ ─────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:careerai}
    password: ${RABBITMQ_PASSWORD:rabbitSecret123!}
    virtual-host: ${RABBITMQ_VHOST:career-ai}
    connection-timeout: 30000
    publisher-confirms: true
    publisher-returns: true

  # ─── MAIL ─────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  # ─── OAUTH2 ───────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: user:email, read:user
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:}
            client-secret: ${LINKEDIN_CLIENT_SECRET:}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/me
            user-name-attribute: sub

  # ─── SPRING AI ────────────────────────────────────────────────
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-3-small
    vertex:
      ai:
        gemini:
          project-id: ${GOOGLE_CLOUD_PROJECT:}
          location: us-central1
          chat:
            options:
              model: gemini-1.5-pro
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  # ─── FILE UPLOAD ──────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── THYMELEAF ────────────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: true

# ─── SERVER ──────────────────────────────────────────────────
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

# ─── ACTUATOR & OBSERVABILITY ────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env, loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans

# ─── SPRINGDOC / SWAGGER ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json

# ─── APPLICATION PROPERTIES ──────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:career-ai-jwt-secret-key-minimum-256-bits-for-hs512-algorithm}
    expiration: ${JWT_EXPIRATION:900000}         # 15 minutes
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
      - http://localhost:5173

  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:openai}
    providers:
      openai:
        enabled: true
      gemini:
        enabled: ${GEMINI_ENABLED:false}

  feature-flags:
    elasticsearch: ${FEATURE_ELASTICSEARCH:false}
    qdrant: ${FEATURE_QDRANT:false}
    kafka: ${FEATURE_KAFKA:false}
    gamification: ${FEATURE_GAMIFICATION:true}
    rag: ${FEATURE_RAG:true}

  rate-limit:
    requests-per-minute: 60
    ai-requests-per-hour: 100

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: 10485760  # 10MB

logging:
  level:
    com.careerai: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
